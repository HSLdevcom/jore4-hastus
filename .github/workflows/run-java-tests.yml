name: Run java tests

on:
  # this workflow is only called by others, won't be executed on itself
  workflow_call:

permissions:
  contents: read

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  run-tests:
    name: Run java tests
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Enable corepack
        run: corepack enable

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: 'jore4-hasura/test/hasura/package.json'
          cache: 'yarn'
          cache-dependency-path: 'jore4-hasura/test/hasura/yarn.lock'

      - name: Start dependencies (blocking until up)
        run: ./development.sh start:deps

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          java-package: jdk
          architecture: x64
          distribution: temurin
          cache: maven

      - name: Run tests and try building a package
        run: |
          # run tests
          mvn -Pprod clean verify
